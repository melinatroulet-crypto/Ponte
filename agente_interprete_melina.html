<style>
  :root{
    --ink:#1a160f; --panel:#241f16; --panel-2:#2c2519;
    --cream:#f2e9d8; --muted:#a99a7c;
    --gold:#c99a5b; --gold-dim:#8a6a3d;
    --sage:#84a98c; --sage-dim:#5c7a66;
    --ponte:#a7b4d9; --ponte-dim:#6c7aa3;
    --pink:#d99cb3; --pink-dim:#8f5f72;
    --red:#c85a4e; --red-dim:#8a3d34;
    --line:rgba(242,233,216,0.12); --danger:#c97a5b;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #2e2717 0%, var(--ink) 55%);
    color:var(--cream); font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:32px 18px 60px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;} }
  .stage{width:100%; max-width:480px;}
  header{text-align:center; margin-bottom:22px;}
  .agent-name{font-family:'Newsreader', serif; font-style:italic; font-weight:500; font-size:2.1rem; color:var(--cream); margin:0;}
  .agent-tag{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); margin-top:6px;}
  .panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius:18px; padding:26px 22px 22px; box-shadow:0 30px 60px -25px rgba(0,0,0,0.6);}
  .screen{display:none;}
  .screen.visible{display:block;}

  /* Screen 1 */
  .key-setup{background:rgba(201,154,91,0.08); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  .key-label{font-family:'Newsreader', serif; font-style:italic; font-size:0.92rem; color:var(--gold); margin:0 0 6px;}
  .key-help{font-size:0.74rem; color:var(--muted); line-height:1.5; margin:0 0 10px;}

  input.text-field{color:var(--cream); font-family:'IBM Plex Sans', sans-serif;}
  .big-cta{margin-top:26px; width:100%; padding:17px; font-size:1.02rem; font-weight:600; border-radius:999px; border:none; background:var(--gold); color:var(--ink); cursor:pointer;}
  .back-link{background:none; border:none; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.1em; cursor:pointer; padding:0; width:auto;}

  .meeting-fields{display:flex; gap:8px; margin-bottom:18px;}

  /* Orb */
  .orb-wrap{display:flex; flex-direction:column; align-items:center; margin:10px 0 18px; position:relative; padding-top:16px;}
  .orb-wrap::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:146px; height:146px; border-radius:50%; border:1px solid var(--line);}
  .orb{width:108px; height:108px; border-radius:50%; transition:background 0.35s ease;}
  .orb.pink-idle{background:radial-gradient(circle at 35% 30%, #ecc3d3, var(--pink-dim) 70%); animation:breathe 2.4s ease-in-out infinite;}

  .orb.red{background:radial-gradient(circle at 35% 30%, #e6968a, var(--red-dim) 70%); animation:vibrateRed 0.45s ease-in-out infinite;}
  .orb.yellow{background:radial-gradient(circle at 35% 30%, #e8c583, var(--gold-dim) 70%); animation:spinGlow 1s linear infinite;}

  @keyframes breathe{0%,100%{transform:scale(1); box-shadow:0 0 0 0 rgba(217,156,179,0.35);} 50%{transform:scale(1.03); box-shadow:0 0 0 10px rgba(217,156,179,0);}}
  @keyframes vibratePink{0%,100%{box-shadow:0 0 0 0 rgba(217,156,179,0.55);} 50%{box-shadow:0 0 0 16px rgba(217,156,179,0);}}
  @keyframes vibrateRed{0%,100%{box-shadow:0 0 0 0 rgba(200,90,78,0.6);} 50%{box-shadow:0 0 0 16px rgba(200,90,78,0);}}

  .status{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-top:10px; text-align:center;}

  button.cta{width:100%; padding:15px; font-size:0.92rem; font-weight:600; border-radius:999px; border:none; cursor:pointer; margin-bottom:9px; transition:transform 0.1s ease, opacity 0.15s ease;}

  .msg{max-width:82%; padding:10px 13px; border-radius:14px; font-size:0.88rem; line-height:1.45;}
  .msg .role{font-family:'IBM Plex Mono', monospace; font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; opacity:0.7; margin-bottom:3px; display:block;}
  .msg.out{align-self:flex-end; background:rgba(201,154,91,0.14); border:1px solid rgba(201,154,91,0.3); border-bottom-right-radius:3px;}
  .msg.in{align-self:flex-start; background:rgba(132,169,140,0.12); border:1px solid rgba(132,169,140,0.28); border-bottom-left-radius:3px;}
  .msg.ponte{align-self:flex-start; background:rgba(167,180,217,0.12); border:1px solid rgba(167,180,217,0.3); border-bottom-left-radius:3px; font-family:'Newsreader', serif; font-style:italic;}
  .msg.pdf{display:flex; align-items:center; gap:10px;}
  .msg.pdf a{color:var(--gold); text-decoration:none; font-weight:600; font-family:'IBM Plex Sans', sans-serif; font-style:normal;}
  .typing-dots{display:flex; gap:4px; padding:4px 0;}
  .typing-dots span{width:6px; height:6px; border-radius:50%; background:var(--ponte); animation:bounce 1.2s infinite ease-in-out;}
  .typing-dots span:nth-child(2){animation-delay:0.15s;} .typing-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0); opacity:0.5;} 40%{transform:translateY(-4px); opacity:1;}}

  .notes-panel{margin-top:16px; padding:12px 14px 8px; background:rgba(201,154,91,0.06); border:1px solid var(--line); border-radius:12px;}
  .notes-title{font-family:'Newsreader', serif; font-style:italic; font-size:0.86rem; color:var(--gold); margin:0 0 6px;}
  .note-item{font-size:0.82rem; color:var(--cream); line-height:1.5; margin-bottom:6px;}
  .topic-block{margin-bottom:12px;}
  .topic-block .tt{font-family:'Newsreader', serif; font-style:italic; font-size:0.92rem; color:var(--gold); margin:0 0 4px;}
  .topic-block .tp{font-size:0.8rem; color:var(--cream); line-height:1.5; margin:0 0 3px; padding-left:12px;}

  #btnFinalizar{margin-top:16px; background:transparent; border:1px solid var(--line); color:var(--muted);}
  .wrapup{margin-top:16px; padding:16px; background:rgba(132,169,140,0.08); border:1px solid rgba(132,169,140,0.3); border-radius:14px; text-align:center;}
  .wrapup p{margin:0 0 12px; font-size:0.9rem;}
  .wrapup .pdf-row{display:flex; gap:8px; margin-bottom:10px;}
  .wrapup .pdf-row a{flex:1; display:inline-block; background:var(--sage); color:#12241a; text-decoration:none; font-weight:600; padding:10px 10px; border-radius:999px; font-size:0.78rem;}
  .wrapup .btn-row{display:flex; gap:8px; margin-top:4px;}
  .wrapup .btn-row button{flex:1; margin-bottom:0;}
  .notice{font-size:0.8rem; font-weight:600; color:var(--danger); margin-top:10px; text-align:center; background:rgba(201,122,91,0.12); border:1px solid rgba(201,122,91,0.35); border-radius:10px; padding:8px 10px;}

  /* Screen 3 — history */
  .history-item{background:rgba(242,233,216,0.04); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px;}
  .history-item .h-name{font-family:'Newsreader', serif; font-style:italic; font-size:1.05rem; color:var(--cream); margin:0 0 2px;}
  .history-item .h-date{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--muted); margin:0 0 10px;}

  .h-icons button:hover{border-color:var(--gold); color:var(--gold);}
  .h-agenda{margin-top:10px; font-size:0.8rem; color:var(--cream); background:rgba(201,154,91,0.06); border-radius:10px; padding:8px 10px;}
  .h-chat{margin-top:10px; display:flex; flex-direction:column; gap:8px;}

  .h-chat-log .hm.ponte{align-self:flex-start; background:rgba(167,180,217,0.12); border:1px solid rgba(167,180,217,0.3); font-family:'Newsreader', serif; font-style:italic;}
  .h-chat-input{display:flex; gap:6px;}
  .h-chat-input textarea{flex:1; background:var(--ink); border:1px solid var(--line); border-radius:10px; color:var(--cream); font-family:'IBM Plex Sans', sans-serif; font-size:0.82rem; padding:8px; resize:none; min-height:36px;}
  .h-chat-input button{width:auto; padding:0 14px; border-radius:10px; border:none; background:var(--gold); color:var(--ink); font-size:0.8rem;}

</style>

<body>
<div class="stage">
  <header>
    <p class="agent-name">Ponte</p>
    <p class="agent-tag">agente intérprete · Melina Roulet</p>
  </header>

  <div class="panel">

    <!-- SCREEN 1 -->
    <div class="screen visible" id="screen1">
      <div class="key-setup" id="keySetup"></div>

      <p class="field-label">O que a Ponte deve fazer?</p>
      <div class="mode-row stacked">
        <button class="mode-btn active" id="s1ModeSecretaria"><span class="mt">👩‍💼 Secretária</span><span class="md">Te acompanha em reuniões — anota, resume e fala por você quando pedir</span></button>
        <button class="mode-btn" id="s1ModeTraducao"><span class="mt">🌐 Tradutora simultânea</span><span class="md">Ouve e traduz ao vivo, em legenda ou voz</span></button>
        <button class="mode-btn" id="s1ModeProfessora"><span class="mt">🇫🇷 Professora de francês</span></button>
      </div>

      <p class="field-label">Idioma da reunião</p>
      <select class="lang-select" id="s1LangSelect"></select>

      <button class="big-cta" id="btnGoScreen2">Ativar agente</button>
      <button class="history-link" id="btnGoHistoryFrom1">📁 Ver histórico de reuniões</button>
    </div>

    <!-- SCREEN 2 -->
    <div class="screen" id="screen2">
      <div class="top-row">
        <button class="back-link" id="btnBack">← configurações</button>
        <button class="back-link" id="btnGoHistoryFrom2">histórico →</button>
      </div>

      <div class="meeting-fields" id="meetingFields">
        <input class="text-field" id="meetingName" placeholder="Nome da reunião / evento">
        <input class="text-field" id="meetingDate" type="date">
      </div>

      <div class="orb-wrap">
        <div class="orb pink-idle" id="orb"></div>
        <p class="status" id="statusText">Pronta</p>
      </div>

      <div class="toggle-row" id="translationToggle" hidden>
        <button class="toggle-btn active" id="modeLegenda">📝 Legenda</button>
        <button class="toggle-btn" id="modeVoz">🔊 Viva voz</button>
      </div>

      <div class="caption-box" id="captionBox" hidden></div>

      <div class="toggle-row" id="outputToggle">
        <button class="toggle-btn active" id="outputVoice">🔊 Responder com voz</button>
        <button class="toggle-btn" id="outputText">✍️ Responder por escrito</button>
      </div>
      <button class="history-link" id="btnTestVoice" style="margin-bottom:14px;">🔊 Testar voz agora</button>

      <button class="cta" id="btnIniciar">Iniciar</button>
      <button class="cta" id="btnAsk">🎤 Perguntar à Ponte</button>

      <div class="ask-input" id="askInputArea">
        <textarea id="askText" rows="1" placeholder="Digite aqui..."></textarea>
        <button id="btnAskSend">Enviar</button>
      </div>

      <p class="notice" id="notice" hidden></p>

      <div class="notes-panel" id="topicsPanel" hidden>
        <p class="notes-title">📚 Assuntos anotados</p>
        <div id="topicsList"></div>
      </div>

      <div class="notes-panel" id="notesPanel" hidden>
        <p class="notes-title">📝 Anotações da reunião</p>
        <div class="notes-list" id="notesList"></div>
      </div>

      <div class="chat" id="chatLog"></div>

      <button class="cta" id="btnFinalizar">Finalizar reunião</button>
      <div class="wrapup" id="wrapupCard" hidden></div>
    </div>

    <!-- SCREEN 3 -->
    <div class="screen" id="screen3">
      <button class="back-link" id="btnBack3">← voltar</button>
      <p class="field-label" style="margin-top:14px;">Histórico de reuniões</p>
      <div id="historyList"></div>
    </div>

  </div>
</div>

<script>
const LANGS = { 'fr-FR':'Français', 'en-US':'English', 'es-ES':'Español', 'de-DE':'Deutsch', 'it-IT':'Italiano' };
const SOURCE_LANG = 'pt-BR';
const SOURCE_LABEL = 'português';

let apiKey = localStorage.getItem('ponte_api_key') || '';
let targetLang = 'fr-FR';
let appMode = 'secretaria'; // 'secretaria' | 'traducao' | 'professora'
let translationOutput = 'legenda'; // 'legenda' | 'voz'
let outputMode = 'voice';
let meetingMode = null; // null | 'silent' | 'simultaneous'
let busy = false;
let recognizing = false;
let listeningForCommand = false;
let finalizedBuffer = '';
let meetingRecognizer = null;
let cmdRecognizer = null;
let transcriptData = [];
let notesData = [];
let meetingHistory = JSON.parse(localStorage.getItem('ponte_history') || '[]');

/* ---------- DOM refs ---------- */
const screen1 = document.getElementById('screen1');
const screen2 = document.getElementById('screen2');
const screen3 = document.getElementById('screen3');
const keySetup = document.getElementById('keySetup');
const s1ModeSecretaria = document.getElementById('s1ModeSecretaria');
const s1ModeTraducao = document.getElementById('s1ModeTraducao');
const s1ModeProfessora = document.getElementById('s1ModeProfessora');
const s1LangSelect = document.getElementById('s1LangSelect');
const btnGoScreen2 = document.getElementById('btnGoScreen2');
const btnBack = document.getElementById('btnBack');
const btnBack3 = document.getElementById('btnBack3');
const btnGoHistoryFrom1 = document.getElementById('btnGoHistoryFrom1');
const btnGoHistoryFrom2 = document.getElementById('btnGoHistoryFrom2');
const meetingName = document.getElementById('meetingName');
const meetingDate = document.getElementById('meetingDate');
const orb = document.getElementById('orb');
const statusText = document.getElementById('statusText');
const outputVoice = document.getElementById('outputVoice');
const outputText = document.getElementById('outputText');
const btnTestVoice = document.getElementById('btnTestVoice');
const btnIniciar = document.getElementById('btnIniciar');
const meetingFields = document.getElementById('meetingFields');
const captionBox = document.getElementById('captionBox');
const translationToggle = document.getElementById('translationToggle');
const modeLegenda = document.getElementById('modeLegenda');
const modeVoz = document.getElementById('modeVoz');
const btnAsk = document.getElementById('btnAsk');
const askText = document.getElementById('askText');
const btnAskSend = document.getElementById('btnAskSend');
const notice = document.getElementById('notice');
const notesPanel = document.getElementById('notesPanel');
const topicsPanel = document.getElementById('topicsPanel');
const topicsList = document.getElementById('topicsList');
let currentTopic = null; // {title, points: []}
let topicLog = []; // assuntos já encerrados

function renderTopics(){
  const all = currentTopic ? [...topicLog, currentTopic] : topicLog;
  if (!all.length) { topicsPanel.hidden = true; return; }
  topicsPanel.hidden = false;
  topicsList.innerHTML = all.map(t =>
    `<div class="topic-block"><p class="tt">${t.title}</p>${t.points.map(p => `<p class="tp">• ${p}</p>`).join('')}</div>`
  ).join('');
}
function topicsAsText(){
  const all = currentTopic ? [...topicLog, currentTopic] : topicLog;
  if (!all.length) return '';
  return all.map(t => `## ${t.title}\n` + t.points.map(p => '- ' + p).join('\n')).join('\n\n');
}
async function ensurePortuguese(text){
  if (!text || !text.trim()) return text;
  try {
    const prompt = `O texto abaixo deveria estar inteiramente em português, mas pode conter trechos em outro idioma por engano. Reescreva TUDO em português, mantendo exatamente a mesma estrutura (títulos de assunto, pontos em lista) e o mesmo nível de detalhe — apenas traduza qualquer parte que não esteja em português. Não resuma, não corte nada, não adicione comentários.\n\nTexto:\n"""${text}"""\n\nResponda APENAS com o texto revisado, sem nenhum comentário adicional.`;
    return await callClaude(prompt, {maxTokens: 8000});
  } catch(e){ console.error('Ponte — erro ao normalizar idioma:', e); return text; }
}
const notesList = document.getElementById('notesList');
const chatLog = document.getElementById('chatLog');
const btnFinalizar = document.getElementById('btnFinalizar');
const wrapupCard = document.getElementById('wrapupCard');
const historyList = document.getElementById('historyList');

Object.entries(LANGS).forEach(([code, label]) => {
  const opt = document.createElement('option'); opt.value = code; opt.textContent = label;
  s1LangSelect.appendChild(opt);
});
s1LangSelect.value = targetLang;
s1LangSelect.addEventListener('change', () => { targetLang = s1LangSelect.value; });
meetingDate.valueAsDate = new Date();

/* ---------- API key setup ---------- */
function renderKeySetup(){
  if (apiKey){
    keySetup.innerHTML = `<div class="key-saved"><span>🔑 Chave de API salva neste navegador</span><button id="btnChangeKey">trocar</button></div>`;
    document.getElementById('btnChangeKey').addEventListener('click', () => { apiKey=''; localStorage.removeItem('ponte_api_key'); renderKeySetup(); });
  } else {
    keySetup.innerHTML = `
      <p class="key-label">Chave de API da Anthropic</p>
      <p class="key-help">Necessária porque este arquivo roda fora do painel de Artifacts do Claude.ai. Fica salva só neste navegador. Não compartilhe este arquivo com a chave já preenchida.</p>
      <div class="key-row"><input type="password" id="apiKeyInput" placeholder="sk-ant-..."><button id="btnSaveKey">Salvar</button></div>
      <p class="key-link"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Pegar uma chave em console.anthropic.com</a></p>`;
    document.getElementById('btnSaveKey').addEventListener('click', () => {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (!val) return;
      apiKey = val; localStorage.setItem('ponte_api_key', val); renderKeySetup();
    });
  }
}
renderKeySetup();

function setAppMode(mode){
  appMode = mode;
  [s1ModeSecretaria, s1ModeTraducao, s1ModeProfessora].forEach(b => b.classList.remove('active'));
  ({secretaria:s1ModeSecretaria, traducao:s1ModeTraducao, professora:s1ModeProfessora})[mode].classList.add('active');
}
s1ModeSecretaria.addEventListener('click', () => setAppMode('secretaria'));
s1ModeTraducao.addEventListener('click', () => setAppMode('traducao'));
s1ModeProfessora.addEventListener('click', () => setAppMode('professora'));

function showScreen(n){
  screen1.classList.remove('visible'); screen2.classList.remove('visible'); screen3.classList.remove('visible');
  ({1:screen1, 2:screen2, 3:screen3})[n].classList.add('visible');
}

/* Safari (e outros) só liberam áudio de fala quando ela começa no mesmo instante de um clique.
   Como a tradução chega depois de uma chamada à IA, "destravamos" o áudio aqui, no clique direto. */
function unlockSpeech(){
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;

}

}
function releaseWakeLock(){

}

/* ---------- Orb / status ---------- */
function setOrbState(state, label){ orb.className = 'orb ' + state; statusText.textContent = label; }
function restingState(){
  if (meetingMode === 'simultaneous') return ['red','Traduzindo ao vivo'];
  if (meetingMode === 'silent') return ['pink-active','Participando'];
  return ['pink-idle','Pronta'];
}

/* ---------- Speech helpers ---------- */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const speechSupported = !!SpeechRecognitionAPI;

function pickVoice(lang){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return voices.find(v => v.lang === lang) || voices.find(v => v.lang && v.lang.startsWith(lang.split('-')[0])) || null;
}
function speakText(text, lang, onDone){
  if (!window.speechSynthesis) { if (onDone) onDone(); return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang; const v = pickVoice(lang); if (v) utter.voice = v;
  utter.onend = () => { if (onDone) onDone(); };
  utter.onerror = () => { if (onDone) onDone(); };
  speechSynthesis.speak(utter);
}
btnTestVoice.addEventListener('click', () => {
  if (!window.speechSynthesis){ showNotice('Este navegador não tem suporte a voz.'); return; }
  speakText('Isso é um teste de voz. Se você está me ouvindo, o áudio está funcionando.', SOURCE_LANG);
});

/* ---------- Claude API ---------- */
async function callClaude(prompt, opts){
  if (!apiKey) throw new Error('Configure sua chave de API primeiro (volte às configurações).');
  const model = (opts && opts.model) || "claude-sonnet-5";
  const maxTokens = (opts && opts.maxTokens) || 700;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type":"application/json", "x-api-key":apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model, max_tokens:maxTokens, messages:[{role:"user", content:prompt}] })
  });
  const data = await response.json();
  if (data.type === 'error') throw new Error((data.error && data.error.message) || 'Erro desconhecido da API');
  const block = (data.content || []).find(b => b.type === 'text');
  return block ? block.text.trim() : '(sem resposta)';
}
function parseJson(raw, fallback){
  try { return JSON.parse(raw.replace(/```json|```/g,'').trim()); } catch(e){ return fallback; }
}

/* ---------- Chat rendering ---------- */
function addMsg(role, text){
  transcriptData.push({who: role==='out'?'you':(role==='in'?'them':'ponte'), original:text, translated:''});
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const roleLabel = role==='out' ? 'Você' : (role==='in' ? 'Interlocutor' : 'Ponte');
  div.innerHTML = `<span class="role">${roleLabel}</span>${text}`;
  chatLog.appendChild(div); chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}
function logSilently(role, text){
  transcriptData.push({who: role==='out'?'you':(role==='in'?'them':'ponte'), original:text, translated:''});
}
function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg ponte'; div.id = 'typingBubble';
  div.innerHTML = `<span class="role">Ponte</span><div class="typing-dots"><span></span><span></span><span></span></div>`;
  chatLog.appendChild(div); chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}
function removeTyping(){ const t = document.getElementById('typingBubble'); if (t) t.remove(); }
function addPdfMsg(label, url){
  const div = document.createElement('div');
  div.className = 'msg ponte pdf';
  div.innerHTML = `<span class="role" style="display:block;width:100%;">Ponte</span>📄 <a href="${url}" target="_blank" rel="noopener">${label} — abrir PDF</a>`;
  chatLog.appendChild(div); chatLog.scrollTop = chatLog.scrollHeight;
}

/* ---------- Notes ---------- */
function addNote(note, type){
  notesData.push({text:note, type:type||''});
  notesPanel.hidden = false;
  const icon = type === 'compromisso' ? '📅' : (type === 'tarefa' ? '✅' : '•');
  const item = document.createElement('div');
  item.className = 'note-item'; item.textContent = icon + ' ' + note;
  notesList.appendChild(item);
}
function notesContext(){
  if (!notesData.length) return '';
  return "\n\nCompromissos e informações já anotados nesta reunião:\n" + notesData.map(n => "- " + n.text).join('\n');
}
function conversationContext(limit){
  const recent = transcriptData.slice(-(limit||12));
  if (!recent.length) return '';
  return recent.map(e => `${e.who==='you'?'Melina':(e.who==='them'?'Interlocutor':'Ponte')}: ${e.original}`).join('\n');
}

/* ---------- PDF generation ---------- */
function makePdf(title, bodyText){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(title, 15, 20);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const lines = doc.splitTextToSize(bodyText || '(sem conteúdo)', 180);
  doc.text(lines, 15, 32);
  return doc.output('blob');
}
function pdfLink(blob){ return URL.createObjectURL(blob); }
function notesAsText(notes){
  if (!notes.length) return 'Nenhuma anotação registrada.';
  return notes.map(n => (n.type==='compromisso'?'[Compromisso] ':(n.type==='tarefa'?'[Tarefa] ':'')) + n.text).join('\n');
}

/* ---------- Meeting modes (Iniciar / Tradução simultânea) ---------- */
let meetingQueue = [];
let processingQueue = false;

function startMeetingMode(mode){
  if (meetingMode === mode){ stopMeetingMode(); return; }
  hardStopMeetingRecognizer();
  meetingMode = mode;
  meetingQueue = [];
  updateMeetingButtons();
  const [state,label] = restingState();
  setOrbState(state,label);
  startMeetingRecognizer();
}
function stopMeetingMode(){
  meetingMode = null;
  meetingQueue = [];
  updateMeetingButtons();
  hardStopMeetingRecognizer();
  setOrbState('pink-idle', 'Pronta');
}
function updateMeetingButtons(){

  btnIniciar.textContent = active ? (appMode==='traducao' ? 'Pausar tradução' : 'Pausar') : (appMode==='traducao' ? 'Iniciar tradução' : 'Iniciar');

/* Recognizer contínuo: nunca para sozinho entre frases. Cada trecho reconhecido entra numa fila,
   que é processada em ordem — assim nada do que a pessoa fala se perde enquanto a Ponte traduz. */
function startMeetingRecognizer(){
  if (!speechSupported || !meetingMode) return;
  meetingRecognizer = new SpeechRecognitionAPI();
  meetingRecognizer.lang = targetLang; meetingRecognizer.interimResults = false; meetingRecognizer.continuous = true;
  meetingRecognizer.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal) meetingQueue.push(e.results[i][0].transcript);
    }
    processQueue();
  };
  meetingRecognizer.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ stopMeetingMode(); showNotice('Microfone bloqueado — modo desativado.'); return; }
    if (meetingMode && !listeningForCommand) setTimeout(startMeetingRecognizer, 600);
  };
  meetingRecognizer.onend = () => {
    if (meetingMode && !listeningForCommand && !busy) setTimeout(startMeetingRecognizer, 250);
  };
  try { meetingRecognizer.start(); } catch(e){ if (meetingMode) setTimeout(startMeetingRecognizer, 800); }
}
function hardStopMeetingRecognizer(){
  if (meetingRecognizer){ meetingRecognizer.onend = null; meetingRecognizer.onerror = null; try{ meetingRecognizer.abort(); }catch(e){} meetingRecognizer = null; }
}

async function processQueue(){
  if (processingQueue) return;
  processingQueue = true;
  while (meetingQueue.length && meetingMode && !busy && !listeningForCommand){
    const text = meetingQueue.shift();

    if (meetingMode === 'silent'){
      setOrbState('yellow', 'Avaliando o que foi dito…');
      try {
        const recentPoints = currentTopic ? currentTopic.points.slice(-5).map(p => '- ' + p).join('\n') : '';
        const prompt = `Você é Ponte, secretária de Melina, acompanhando uma aula/reunião em ${LANGS[targetLang]}. Seu trabalho NÃO é transcrever ou traduzir tudo — é agir como uma boa aluna/secretária, filtrando o que realmente vale a pena reter, e ignorando saudações, transições, comentários soltos, repetições ou falas sem conteúdo substancial.\n\nIMPORTANTE: mesmo o áudio sendo em ${LANGS[targetLang]}, TUDO que você escrever (título do assunto e ponto) deve estar em português. Nunca escreva em ${LANGS[targetLang]}.\n\n${currentTopic ? `Assunto em andamento: "${currentTopic.title}"\nÚltimos pontos já anotados nesse assunto:\n${recentPoints}` : 'Ainda não há assunto em andamento — este é o primeiro trecho.'}\n\nTrecho ouvido agora: """${text}"""\n\nPrimeiro decida se este trecho contém algo que realmente vale a pena anotar como aprendizado (um conceito, uma explicação, um dado, uma conclusão) — marque "relevante":false para qualquer coisa que seja só enrolação, transição, saudação ou repetição do que já foi dito. Só se for relevante, decida também se continua o MESMO assunto ou se mudou, e escreva o ponto principal de forma clara e completa (a ideia, não a frase literal).\n\nResponda SOMENTE com JSON: {"relevante": true|false, "mesmo_assunto": true|false, "titulo_assunto": "título curto e claro do assunto, SEMPRE EM PORTUGUÊS", "ponto": "o ponto principal, SEMPRE EM PORTUGUÊS, de forma completa e informativa (vazio se relevante=false)", "nota": "compromisso/data/tarefa relevante SE houver, senão vazio — isso vale mesmo se relevante=false", "nota_tipo": "compromisso"|"tarefa"|""}`;
        const raw = await callClaude(prompt, {model:'claude-sonnet-5', maxTokens:350});
        const parsed = parseJson(raw, {relevante:true, mesmo_assunto:true, titulo_assunto: currentTopic?currentTopic.title:'Assunto geral', ponto:text, nota:'', nota_tipo:''});

        if (parsed.nota) addNote(parsed.nota, parsed.nota_tipo);

        if (parsed.relevante && parsed.ponto){
          let isNewTopic = false;
          if (!currentTopic){
            currentTopic = { title: parsed.titulo_assunto, points: [parsed.ponto] };
            isNewTopic = true;
          } else if (parsed.mesmo_assunto){
            currentTopic.points.push(parsed.ponto);
            if (parsed.titulo_assunto) currentTopic.title = parsed.titulo_assunto;
          } else {
            topicLog.push(currentTopic);
            currentTopic = { title: parsed.titulo_assunto, points: [parsed.ponto] };
            isNewTopic = true;
          }
          renderTopics();
          if (isNewTopic) addMsg('ponte', `📚 Entendi que agora estamos falando sobre "${currentTopic.title}" — vou anotar os pontos importantes.`);
          addMsg('ponte', `📝 ${parsed.ponto}`);
        }
      } catch(err){ console.error('Ponte — erro no rastreamento de assunto:', err); }
      if (meetingMode){ const [s,l] = restingState(); setOrbState(s,l); }
      continue;
    }

    const context = conversationContext(4);
    const prompt = `Ponte, intérprete de Melina, em ${LANGS[targetLang]}. Traduza para português com naturalidade, entendendo o contexto — não palavra por palavra.\n\n${context ? "Contexto:\n"+context+"\n\n":""}Trecho: """${text}"""\n\nJSON apenas: {"translation":"...", "note":"compromisso/data/tarefa relevante, se houver, senão vazio", "note_type":"compromisso"|"tarefa"|""}`;
    captionBox.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    setOrbState('yellow', 'Traduzindo…');
    try {
      const raw = await callClaude(prompt, {model:'claude-haiku-4-5-20251001', maxTokens:200});
      const parsed = parseJson(raw, {translation:raw, note:'', note_type:''});
      addMsg('in', parsed.translation);
      if (parsed.note) addNote(parsed.note, parsed.note_type);
      captionBox.textContent = parsed.translation;
      if (translationOutput === 'voz'){
        setOrbState('green', 'Traduzindo ao vivo');
        await new Promise(res => speakText(parsed.translation, SOURCE_LANG, res));
      }
    } catch(err){
      console.error('Ponte — erro na fila de tradução:', err);
      captionBox.textContent = '';
    }
    if (meetingMode){ const [s,l] = restingState(); setOrbState(s,l); }
  }
  processingQueue = false;
}

function showNotice(msg){ notice.textContent = msg; notice.hidden = !msg; }
function stopAllListening(){
  hardStopMeetingRecognizer();
  if (cmdRecognizer){ try{ cmdRecognizer.abort(); }catch(e){} }
  if (window.speechSynthesis) speechSynthesis.cancel();
  meetingMode = null; meetingQueue = []; listeningForCommand = false; busy = false;
}

/* ---------- Perguntar à Ponte — toque para começar, toque para finalizar ---------- */
btnAsk.addEventListener('click', () => {
  if (busy) return;
  if (!listeningForCommand) startVoiceCommand(); else finishVoiceCommand();
});

function startVoiceCommand(){
  unlockSpeech();
  if (window.speechSynthesis) speechSynthesis.cancel();
  listeningForCommand = true;
  finalizedBuffer = '';
  askText.value = '';
  btnAsk.textContent = '✅ Finalizar pergunta';
  btnAsk.classList.add('on');
  hardStopMeetingRecognizer();
  setOrbState('red', 'Ouvindo você… toque em "Finalizar" quando terminar');
  showNotice('');
  if (!speechSupported){ showNotice('Reconhecimento de voz indisponível — digite e envie normalmente.'); return; }
  cmdRecognizer = new SpeechRecognitionAPI();
  cmdRecognizer.lang = SOURCE_LANG; cmdRecognizer.continuous = true; cmdRecognizer.interimResults = true;
  cmdRecognizer.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const seg = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalizedBuffer += seg + ' ';
      else interim += seg;
    }
    askText.value = (finalizedBuffer + interim).trim();
  };
  cmdRecognizer.onerror = (e) => {
    if (e.error==='not-allowed'||e.error==='service-not-allowed') showNotice('Microfone bloqueado — use o campo de texto.');
  };
  cmdRecognizer.onend = () => { if (listeningForCommand) finishVoiceCommand(); };
  try { cmdRecognizer.start(); } catch(e){}
}

function finishVoiceCommand(){
  listeningForCommand = false;
  btnAsk.textContent = appMode==='professora' ? '🎤 Falar com a professora' : '🎤 Perguntar à Ponte';
  btnAsk.classList.remove('on');
  if (cmdRecognizer){ try{ cmdRecognizer.stop(); }catch(e){} }
  const text = askText.value.trim();
  if (text) submitCommand(text);
  else { const [state,label]=restingState(); setOrbState(state,label); }
}

btnAskSend.addEventListener('click', () => {
  if (listeningForCommand){ listeningForCommand=false; if(cmdRecognizer){try{cmdRecognizer.abort();}catch(e){}} btnAsk.textContent = appMode==='professora'?'🎤 Falar com a professora':'🎤 Perguntar à Ponte'; btnAsk.classList.remove('on'); }
  submitCommand(askText.value.trim());
});
askText.addEventListener('keydown', (e) => {
  if (e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    if (listeningForCommand){ listeningForCommand=false; if(cmdRecognizer){try{cmdRecognizer.abort();}catch(e){}} btnAsk.textContent = appMode==='professora'?'🎤 Falar com a professora':'🎤 Perguntar à Ponte'; btnAsk.classList.remove('on'); }
    submitCommand(askText.value.trim());
  }
});

function submitCommand(text){
  if (busy || !text) return;
  askText.value = '';
  askText.disabled = true; btnAskSend.disabled = true;
  if (cmdRecognizer){ try{ cmdRecognizer.abort(); }catch(e){} }
  hardStopMeetingRecognizer();
  addMsg('out', text);
  handleCommand(text);
}

async function handleCommand(text){
  busy = true;
  setOrbState('yellow', appMode==='professora' ? 'Pensando…' : 'Entendendo…');
  const typingBubble = addTyping();
  const slow = setTimeout(() => { statusText.textContent = 'Só mais um instante…'; }, 4000);

  try {
    if (appMode==='professora'){
      const context = conversationContext(16);
      const prompt = `Você é Ponte, professora particular de francês de Melina (nível B1). Seja didática, clara e encorajadora, sempre em português, com exemplos em francês quando fizer sentido.\n\n${context?"Histórico:\n"+context+"\n\n":""}Pergunta de Melina: "${text}"`;
      const answer = await callClaude(prompt);
      clearTimeout(slow); removeTyping();
      setOrbState('green', 'Respondendo…');
      addMsg('ponte', answer);
      deliverVoiceIfNeeded(answer, () => finishTurn());
      return;
    }

    const context = conversationContext(16);
    const prompt = `Você é Ponte, intérprete de negócios de Melina, participando de uma reunião ao vivo em ${LANGS[targetLang]}. Ela acabou de se dirigir a você.\n\n${context?"O que já foi dito:\n"+context+"\n\n":"(sem histórico ainda)\n\n"}O que Melina disse: "${text}"\n\n${notesContext()}\n\nResponda SOMENTE com JSON:\n{"action":"speak_for_her"|"stand_down"|"answer", "content_to_speak":"fala em ${LANGS[targetLang]} se action=speak_for_her, senão vazio", "reply_to_melina":"resposta em português para os outros casos", "is_summary": true|false}\n\nRegras: "speak_for_her" quando ela pedir para você falar por ela à reunião. "stand_down" quando ela só confirmar que entendeu e quer silêncio. "answer" para resumos/explicações — marque "is_summary":true quando for um resumo longo da reunião (isso vai virar PDF), e false para uma resposta curta/pontual.`;
    const raw = await callClaude(prompt);
    clearTimeout(slow); removeTyping();
    const parsed = parseJson(raw, {action:'answer', content_to_speak:'', reply_to_melina:raw, is_summary:false});

    setOrbState('green', 'Respondendo…');

    if (parsed.action === 'speak_for_her' && parsed.content_to_speak){
      addMsg('out', parsed.content_to_speak);
      speakText(parsed.content_to_speak, targetLang, () => finishTurn());
    } else if (parsed.is_summary && parsed.reply_to_melina){
      const url = pdfLink(makePdf('Resumo — Ponte', parsed.reply_to_melina));
      addPdfMsg('Resumo da reunião', url);
      finishTurn();
    } else {
      const reply = parsed.reply_to_melina || '';
      if (reply) addMsg('ponte', reply);
      deliverVoiceIfNeeded(reply, () => finishTurn());
    }
  } catch (err) {
    clearTimeout(slow); removeTyping();
    console.error('Ponte — erro em handleCommand:', err);
    showNotice('A Ponte não conseguiu responder: ' + (err && err.message ? err.message : 'erro desconhecido'));
    finishTurn();
  }
}

function deliverVoiceIfNeeded(text, onDone){
  if (text && outputMode === 'voice') speakText(text, SOURCE_LANG, onDone);
  else onDone();
}
function finishTurn(){
  busy = false;
  askText.disabled = false; btnAskSend.disabled = false;
  const [state, label] = restingState();
  setOrbState(state, label);
  if (meetingMode){ startMeetingRecognizer(); processQueue(); }
}

/* ---------- Finalizar reunião ---------- */
btnFinalizar.addEventListener('click', async () => {
  const isTraducao = appMode === 'traducao';
  btnFinalizar.disabled = true;
  btnFinalizar.textContent = '✓ Finalizando…';
  stopMeetingMode();
  setOrbState('yellow', 'Revisando anotações…');
  try {
    const context = conversationContext(80);
    let topics = topicsAsText();
    if (topics) topics = await ensurePortuguese(topics);
    setOrbState('yellow', 'Preparando resumo final…');
    const prompt = isTraducao
      ? `Você é Ponte, tradutora simultânea de Melina. A sessão de tradução terminou. Com base no histórico abaixo, escreva um resumo bem estruturado em português dos principais pontos e aprendizados do que foi traduzido — não é uma ata de reunião de negócios, é um resumo de conteúdo (aula, palestra, sermão, etc.).\n\n${context || '(sem conteúdo registrado)'}${notesContext()}`
      : topics
        ? `Você é Ponte, secretária de Melina. A sessão terminou. Abaixo estão os assuntos já organizados em tópicos, cada um com os pontos anotados ao longo da fala. Escreva um resumo PROFUNDO em português, organizado por assunto (use os mesmos títulos como subtítulos) — para CADA assunto listado, sem pular nenhum, desenvolva um ou mais parágrafos explicando o conteúdo de forma completa e conectada, como material de estudo — não apenas repita os pontos soltos em lista. Não resuma demais: o objetivo é profundidade, não brevidade.\n\n${topics}${notesContext()}${context ? "\n\nTrocas diretas com Melina durante a sessão (comandos e respostas), para contexto adicional:\n"+context : ''}`
        : `Você é Ponte, intérprete de Melina. A reunião terminou. Com base no histórico abaixo, escreva um resumo executivo bem estruturado em português: tópicos discutidos, decisões e próximos passos.\n\n${context || '(sem conteúdo registrado)'}${notesContext()}`;
    const summary = await callClaude(prompt, {maxTokens:4000});

    const name = meetingName.value.trim() || (isTraducao ? 'Tradução sem nome' : 'Reunião sem nome');
    const date = meetingDate.value || new Date().toISOString().slice(0,10);
    const summaryBlob = makePdf(name + ' — Resumo', summary);
    const detailedNotes = (!isTraducao && topics)
      ? topics + (notesData.length ? "\n\nCompromissos e tarefas:\n" + notesAsText(notesData) : '')
      : notesAsText(notesData);
    const notesBlob = makePdf(name + ' — Anotações', detailedNotes);
    const summaryUrl = pdfLink(summaryBlob);
    const notesUrl = pdfLink(notesBlob);

    meetingHistory.unshift({ name, date, summary, notes: notesData.slice(), topics: (currentTopic ? [...topicLog, currentTopic] : topicLog).slice() });
    localStorage.setItem('ponte_history', JSON.stringify(meetingHistory));

    btnFinalizar.textContent = isTraducao ? '✓ Tradução finalizada' : '✓ Reunião finalizada';

    wrapupCard.hidden = false;
    wrapupCard.innerHTML = `<p>${isTraducao ? 'Tradução finalizada.' : 'Reunião finalizada.'}</p>
      <div class="pdf-row">
        <a href="${summaryUrl}" download="${name}-resumo.pdf">📄 Resumo</a>
        <a href="${notesUrl}" download="${name}-anotacoes.pdf">📝 Anotações</a>
      </div>`;
    const goHistory = document.createElement('button');
    goHistory.className='history-link'; goHistory.style.margin='0 auto 10px'; goHistory.textContent='Ver histórico completo →';
    goHistory.addEventListener('click', () => { renderHistory(); showScreen(3); });
    wrapupCard.appendChild(goHistory);

    function resetSession(){
      transcriptData=[]; notesData=[]; chatLog.innerHTML=''; notesList.innerHTML=''; notesPanel.hidden=true;
      currentTopic=null; topicLog=[]; topicsList.innerHTML=''; topicsPanel.hidden=true;
      wrapupCard.hidden=true; wrapupCard.innerHTML=''; meetingName.value=''; meetingDate.valueAsDate=new Date();
      btnFinalizar.disabled = false; btnFinalizar.textContent = isTraducao ? 'Finalizar tradução' : 'Finalizar reunião';
      captionBox.textContent = '';
      setOrbState('pink-idle','Pronta');
    }

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    const btnNew = document.createElement('button');
    btnNew.className = 'cta'; btnNew.textContent = isTraducao ? 'Nova tradução' : 'Nova reunião';
    btnNew.addEventListener('click', resetSession);
    const btnMenu = document.createElement('button');
    btnMenu.className = 'cta'; btnMenu.style.background='transparent'; btnMenu.style.border='1px solid var(--line)'; btnMenu.style.color='var(--muted)';
    btnMenu.textContent = '← Menu principal';
    btnMenu.addEventListener('click', () => { resetSession(); showScreen(1); });
    btnRow.appendChild(btnNew); btnRow.appendChild(btnMenu);
    wrapupCard.appendChild(btnRow);
  } catch(err){
    console.error('Ponte — erro ao finalizar:', err);
    showNotice('Não consegui gerar o resumo final: ' + (err && err.message ? err.message : 'erro desconhecido'));
    btnFinalizar.disabled = false; btnFinalizar.textContent = isTraducao ? 'Finalizar tradução' : 'Finalizar reunião';
    setOrbState('pink-idle','Pronta');
  }
});

/* ---------- Screen 3 — Histórico ---------- */
function formatTopics(topics){
  if (!topics || !topics.length) return '';
  return topics.map(t => `## ${t.title}\n` + t.points.map(p=>'- '+p).join('\n')).join('\n\n');
}

function renderHistory(){
  if (!meetingHistory.length){ historyList.innerHTML = '<p class="empty-hint">Nenhuma reunião finalizada ainda.</p>'; return; }
  historyList.innerHTML = '';
  meetingHistory.forEach((m, idx) => {
    const div = document.createElement('div');
    div.className = 'history-item';
    const compromissos = (m.notes||[]).filter(n => n.type==='compromisso');
    div.innerHTML = `
      <p class="h-name">${m.name}</p>
      <p class="h-date">${m.date}</p>
      <div class="h-icons">
        <button data-a="resumo">📄 Resumo</button>
        <button data-a="anotacoes">📝 Anotações</button>
        <button data-a="agenda">📅 Agendamento</button>
        <button data-a="perguntar">💬 Perguntar</button>
      </div>
      <div class="h-agenda" id="agenda-${idx}" hidden></div>
      <div class="h-chat" id="hchat-${idx}" hidden>
        <div class="h-chat-log" id="hchatlog-${idx}"></div>
        <div class="h-chat-input">
          <textarea id="hchatinput-${idx}" rows="1" placeholder="Pergunte sobre esta sessão, ou aponte algo pra corrigir no resumo..."></textarea>
          <button id="hchatsend-${idx}">Enviar</button>
        </div>
      </div>`;
    div.querySelector('[data-a="resumo"]').addEventListener('click', () => {
      const url = pdfLink(makePdf(m.name + ' — Resumo', m.summary));
      window.open(url, '_blank');
    });
    div.querySelector('[data-a="anotacoes"]').addEventListener('click', () => {
      const topicsText = formatTopics(m.topics);
      const content = topicsText
        ? topicsText + ((m.notes||[]).length ? "\n\nCompromissos e tarefas:\n" + notesAsText(m.notes) : '')
        : notesAsText(m.notes||[]);
      const url = pdfLink(makePdf(m.name + ' — Anotações', content));
      window.open(url, '_blank');
    });
    div.querySelector('[data-a="agenda"]').addEventListener('click', () => {
      const box = document.getElementById('agenda-'+idx);
      box.hidden = !box.hidden;
      if (!box.hidden) box.textContent = compromissos.length ? compromissos.map(c=>'📅 '+c.text).join(' · ') : 'Nenhum compromisso anotado nesta reunião.';
    });
    div.querySelector('[data-a="perguntar"]').addEventListener('click', () => {
      const box = document.getElementById('hchat-'+idx);
      box.hidden = !box.hidden;
    });

    const sendBtn = div.querySelector(`#hchatsend-${idx}`);
    const input = div.querySelector(`#hchatinput-${idx}`);
    const log = div.querySelector(`#hchatlog-${idx}`);
    async function ask(){
      const q = input.value.trim();
      if (!q) return;
      input.value = ''; sendBtn.disabled = true; input.disabled = true;
      const qDiv = document.createElement('div'); qDiv.className='hm you'; qDiv.textContent = q;
      log.appendChild(qDiv);
      const typingDiv = document.createElement('div'); typingDiv.className='hm ponte';
      typingDiv.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      log.appendChild(typingDiv); log.scrollTop = log.scrollHeight;
      try {
        const topicsText = formatTopics(m.topics);
        const notesText = notesAsText(m.notes||[]);
        const prompt = `Você é Ponte. Você acompanhou esta sessão ("${m.name}", ${m.date}) e tem registrado:\n\n${topicsText ? "Assuntos e pontos anotados:\n"+topicsText+"\n\n" : ""}Resumo já escrito:\n${m.summary}\n\n${notesText ? "Anotações/compromissos:\n"+notesText+"\n\n" : ""}Agora, depois do fato, Melina pergunta ou comenta: "${q}"\n\nDecida: ela está só fazendo uma pergunta sobre o conteúdo, ou está apontando algo errado/faltando que deveria corrigir o resumo? Responda SOMENTE com JSON: {"action":"answer"|"update_summary", "answer":"resposta direta em português para Melina", "updated_summary":"o resumo INTEIRO já revisado e completo, incorporando a correção, SE action=update_summary — senão deixe vazio"}`;
        const raw = await callClaude(prompt, {maxTokens:1200});
        const parsed = parseJson(raw, {action:'answer', answer:raw, updated_summary:''});
        typingDiv.remove();
        if (parsed.action === 'update_summary' && parsed.updated_summary){
          m.summary = parsed.updated_summary;
          localStorage.setItem('ponte_history', JSON.stringify(meetingHistory));
          const aDiv = document.createElement('div'); aDiv.className='hm ponte';
          aDiv.textContent = (parsed.answer || 'Atualizei o resumo com essa informação.') + ' ✓ Resumo atualizado.';
          log.appendChild(aDiv);
        } else {
          const aDiv = document.createElement('div'); aDiv.className='hm ponte';
          aDiv.textContent = parsed.answer || raw;
          log.appendChild(aDiv);
        }
      } catch(err){
        typingDiv.remove();
        console.error('Ponte — erro ao perguntar sobre sessão:', err);
        const eDiv = document.createElement('div'); eDiv.className='hm ponte';
        eDiv.textContent = 'Não consegui responder agora: ' + (err && err.message ? err.message : 'erro desconhecido');
        log.appendChild(eDiv);
      }
      log.scrollTop = log.scrollHeight;
      sendBtn.disabled = false; input.disabled = false;
    }
    sendBtn.addEventListener('click', ask);
    input.addEventListener('keydown', (e) => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); } });

    historyList.appendChild(div);
  });
}
</script>
